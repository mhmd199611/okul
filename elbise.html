<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kıyafetler Öğrenme Oyunu</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap');
        body {
            font-family: 'Fredoka', sans-serif;
            background-color: #f0f9ff;
        }
        .btn-option {
            transition: all 0.2s ease;
        }
        .btn-option:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center p-4">

    <!-- Header / Progress Bar -->
    <div class="w-full max-w-md bg-white rounded-2xl shadow-md p-4 mb-4 border-2 border-indigo-100">
        <div class="flex justify-between items-center mb-2">
            <span class="text-indigo-600 font-bold text-lg" id="question-count">Soru: 1 / 23</span>
            <span class="bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full text-sm font-bold" id="score">Puan: 0</span>
        </div>
        <div class="w-full bg-gray-200 rounded-full h-3">
            <div id="progress-bar" class="bg-indigo-500 h-3 rounded-full transition-all duration-300" style="width: 0%"></div>
        </div>
    </div>

    <!-- Main Game Container -->
    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl p-6 border-4 border-indigo-200 text-center flex-grow flex flex-col justify-between">
        
        <h2 class="text-xl font-bold text-gray-700 mb-2">Bu nedir?</h2>

        <!-- Image Display Box (Only Images) -->
        <div class="w-full h-64 bg-slate-50 rounded-2xl border-2 border-indigo-200 flex items-center justify-center p-2 mb-6 overflow-hidden shadow-inner">
            <img id="item-image" class="max-h-full max-w-full object-contain rounded-xl" alt="Kıyafet Görseli">
        </div>

        <!-- 4 Answer Options -->
        <div id="options-container" class="grid grid-cols-2 gap-3 mb-2">
            <!-- Dynamic Buttons generated by JS -->
        </div>

        <!-- Feedback Message -->
        <div id="feedback" class="h-8 font-bold text-lg mt-2 flex items-center justify-center"></div>
    </div>

    <!-- Final Score Screen -->
    <div id="result-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl border-4 border-indigo-300">
            <div class="text-6xl mb-4" id="result-emoji">🎉</div>
            <h2 class="text-2xl font-bold text-gray-800 mb-2">Tebrikler! Oyun Bitti!</h2>
            <p class="text-gray-600 mb-4" id="final-score-text">Toplam Puanınız: 0 / 23</p>
            <button onclick="restartGame()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-2xl shadow-lg transition active:scale-95 text-lg">
                Tekrar Oyna 🔄
            </button>
        </div>
    </div>

    <script>
        // List of all items with exact image file paths
        const vocabularyData = [
            { id: "1", turkish: "şapka", imgSrc: "images/1.jpg" },
            { id: "2", turkish: "tişört", imgSrc: "images/2.webp" },
            { id: "3", turkish: "kemer", imgSrc: "images/3.webp" },
            { id: "4", turkish: "pantolon", imgSrc: "images/4.jfif" },
            { id: "5", turkish: "gömlek", imgSrc: "images/5.jpg" },
            { id: "6", turkish: "şort", imgSrc: "images/6.jfif" },
            { id: "7", turkish: "çorap", imgSrc: "images/7.jfif" },
            { id: "8", turkish: "ayakkabı", imgSrc: "images/8.webp" },
            { id: "9", turkish: "gözlük", imgSrc: "images/9.webp" },
            { id: "11", turkish: "etek", imgSrc: "images/10.jpg" },
            { id: "12", turkish: "terlik", imgSrc: "images/12.webp" },
            { id: "13", turkish: "şemsiye", imgSrc: "images/11.webp" },
            { id: "14", turkish: "kazak", imgSrc: "images/13.jpg" },
            { id: "15", turkish: "palto", imgSrc: "images/14.jpg" },
            { id: "16", turkish: "bot", imgSrc: "images/15.jfif" },
            { id: "17", turkish: "bere", imgSrc: "images/16.webp" },
            { id: "18", turkish: "atkı", imgSrc: "images/17.jfif" },
            { id: "19", turkish: "mont", imgSrc: "images/18.jfif" },
            { id: "20", turkish: "eldiven", imgSrc: "images/19.webp" },
            { id: "21", turkish: "kravat", imgSrc: "images/20.jfif" },
            { id: "22", turkish: "ceket", imgSrc: "images/22.jfif" }
            
        ];

        let questions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let canAnswer = true;

        // Sound effects generator
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.setValueAtTime(140, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function startGame() {
            questions = shuffle([...vocabularyData]);
            currentQuestionIndex = 0;
            score = 0;
            canAnswer = true;
            document.getElementById('result-modal').classList.add('hidden');
            updateUI();
            loadQuestion();
        }

        function loadQuestion() {
            canAnswer = true;
            document.getElementById('feedback').innerText = '';
            
            const currentItem = questions[currentQuestionIndex];
            const imgElement = document.getElementById('item-image');

            // Directly set image path
            imgElement.src = currentItem.imgSrc;

            // Generate 4 Options (1 correct + 3 wrong options)
            const otherItems = vocabularyData.filter(i => i.id !== currentItem.id);
            const wrongOptions = shuffle(otherItems).slice(0, 3);
            const options = shuffle([currentItem, ...wrongOptions]);

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            options.forEach(option => {
                const btn = document.createElement('button');
                btn.className = 'btn-option bg-indigo-50 hover:bg-indigo-100 text-indigo-900 border-2 border-indigo-200 font-bold py-4 px-2 rounded-2xl shadow text-lg flex items-center justify-center';
                btn.innerText = option.turkish;
                btn.onclick = () => checkAnswer(option.id, btn);
                optionsContainer.appendChild(btn);
            });

            updateUI();
        }

        function checkAnswer(selectedId, btnElement) {
            if (!canAnswer) return;
            canAnswer = false;

            const currentItem = questions[currentQuestionIndex];
            const feedback = document.getElementById('feedback');

            if (selectedId === currentItem.id) {
                score++;
                playSound('correct');
                btnElement.className = 'btn-option bg-emerald-500 text-white font-bold py-4 px-2 rounded-2xl shadow text-lg flex items-center justify-center border-2 border-emerald-600';
                feedback.innerHTML = '<span class="text-emerald-600">Doğru! 👏</span>';
            } else {
                playSound('wrong');
                btnElement.className = 'btn-option bg-rose-500 text-white font-bold py-4 px-2 rounded-2xl shadow text-lg flex items-center justify-center border-2 border-rose-600';
                feedback.innerHTML = `<span class="text-rose-600">Yanlış! (Doğru: ${currentItem.turkish})</span>`;
            }

            setTimeout(() => {
                currentQuestionIndex++;
                if (currentQuestionIndex < questions.length) {
                    loadQuestion();
                } else {
                    showFinalResult();
                }
            }, 1200);
        }

        function updateUI() {
            document.getElementById('question-count').innerText = `Soru: ${currentQuestionIndex + 1} / ${questions.length}`;
            document.getElementById('score').innerText = `Puan: ${score}`;
            const progressPercentage = ((currentQuestionIndex) / questions.length) * 100;
            document.getElementById('progress-bar').style.width = `${progressPercentage}%`;
        }

        function showFinalResult() {
            document.getElementById('progress-bar').style.width = '100%';
            const modal = document.getElementById('result-modal');
            const scoreText = document.getElementById('final-score-text');
            const emoji = document.getElementById('result-emoji');

            scoreText.innerText = `Toplam Puanınız: ${score} / ${questions.length}`;

            if (score === questions.length) {
                emoji.innerText = '🏆';
            } else if (score >= questions.length / 2) {
                emoji.innerText = '🌟';
            } else {
                emoji.innerText = '💪';
            }

            modal.classList.remove('hidden');
        }

        function restartGame() {
            startGame();
        }

        window.onload = startGame;
    </script>
</body>
</html>
